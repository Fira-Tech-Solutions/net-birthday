      <g transform="rotate(140)"><line x1="0" y1="-4" x2="0" y2="-19"/><circle cx="0" cy="-20" r="1.6" fill="#D9A662" stroke="none"/></g>
      <g transform="rotate(160)"><line x1="0" y1="-4" x2="0" y2="-19"/><circle cx="0" cy="-20" r="1.6" fill="#D9A662" stroke="none"/></g>
      <g transform="rotate(180)"><line x1="0" y1="-4" x2="0" y2="-19"/><circle cx="0" cy="-20" r="1.6" fill="#D9A662" stroke="none"/></g>
      <g transform="rotate(200)"><line x1="0" y1="-4" x2="0" y2="-19"/><circle cx="0" cy="-20" r="1.6" fill="#D9A662" stroke="none"/></g>
      <g transform="rotate(220)"><line x1="0" y1="-4" x2="0" y2="-19"/><circle cx="0" cy="-20" r="1.6" fill="#D9A662" stroke="none"/></g>
      <g transform="rotate(240)"><line x1="0" y1="-4" x2="0" y2="-19"/><circle cx="0" cy="-20" r="1.6" fill="#D9A662" stroke="none"/></g>
      <g transform="rotate(260)"><line x1="0" y1="-4" x2="0" y2="-19"/><circle cx="0" cy="-20" r="1.6" fill="#D9A662" stroke="none"/></g>
      <g transform="rotate(280)"><line x1="0" y1="-4" x2="0" y2="-19"/><circle cx="0" cy="-20" r="1.6" fill="#D9A662" stroke="none"/></g>
      <g transform="rotate(300)"><line x1="0" y1="-4" x2="0" y2="-19"/><circle cx="0" cy="-20" r="1.6" fill="#D9A662" stroke="none"/></g>
      <g transform="rotate(320)"><line x1="0" y1="-4" x2="0" y2="-19"/><circle cx="0" cy="-20" r="1.6" fill="#D9A662" stroke="none"/></g>
      <g transform="rotate(340)"><line x1="0" y1="-4" x2="0" y2="-19"/><circle cx="0" cy="-20" r="1.6" fill="#D9A662" stroke="none"/></g>
    </g>

    <!-- tiny pollen dots at the very center -->
    <g fill="#FFC940">
      <ellipse cx="-3" cy="-2" rx="2.1" ry="1.5" transform="rotate(20)"/>
      <ellipse cx="3" cy="-2" rx="2.1" ry="1.5" transform="rotate(-15)"/>
      <ellipse cx="0" cy="3" rx="2.1" ry="1.5"/>
      <ellipse cx="-2" cy="1" rx="2" ry="1.4" transform="rotate(60)"/>
      <ellipse cx="2" cy="1" rx="2" ry="1.4" transform="rotate(-60)"/>
      <ellipse cx="0" cy="-4" rx="1.8" ry="1.3"/>
    </g>
  </g>
</svg>
