        <path d="M0,-14 L0,-86" stroke="#E6A400" stroke-width="1.3" stroke-opacity="0.55" stroke-linecap="round"/>
        <line x1="-5" y1="-56" x2="6" y2="-50" stroke="#E6A400" stroke-width="4.5" stroke-opacity="0.28" stroke-linecap="round"/>
      </g>

