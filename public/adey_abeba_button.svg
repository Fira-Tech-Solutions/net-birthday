      <g transform="rotate(2)">
        <path d="M0,-6 C-16,-42 -14,-78 0,-108 C14,-78 16,-42 0,-6 Z"
              fill="#FDE100" stroke="#E6A400" stroke-width="1" stroke-opacity="0.5"/>
        <path d="M0,-14 L0,-96" stroke="#E6A400" stroke-width="1.3" stroke-opacity="0.55" stroke-linecap="round"/>
        <line x1="-6" y1="-52" x2="6" y2="-46" stroke="#E6A400" stroke-width="5" stroke-opacity="0.28" stroke-linecap="round"/>
      </g>

      <g transform="rotate(47)">
        <path d="M0,-6 C-16,-40 -13,-74 0,-102 C13,-74 16,-40 0,-6 Z"
