        <path d="M0,-14 L0,-90" stroke="#E6A400" stroke-width="1.3" stroke-opacity="0.55" stroke-linecap="round"/>
        <line x1="-5" y1="-30" x2="7" y2="-24" stroke="#E6A400" stroke-width="5" stroke-opacity="0.28" stroke-linecap="round"/>
      </g>

