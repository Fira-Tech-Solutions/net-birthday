<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFC94A" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#F5A623" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
