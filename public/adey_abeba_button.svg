      <g transform="rotate(60)"><line x1="0" y1="-4" x2="0" y2="-19"/><circle cx="0" cy="-20" r="1.6" fill="#D9A662" stroke="none"/></g>
      <g transform="rotate(80)"><line x1="0" y1="-4" x2="0" y2="-19"/><circle cx="0" cy="-20" r="1.6" fill="#D9A662" stroke="none"/></g>
      <g transform="rotate(100)"><line x1="0" y1="-4" x2="0" y2="-19"/><circle cx="0" cy="-20" r="1.6" fill="#D9A662" stroke="none"/></g>
