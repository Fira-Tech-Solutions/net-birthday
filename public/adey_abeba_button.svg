        <line x1="-6" y1="-70" x2="6" y2="-64" stroke="#E6A400" stroke-width="5" stroke-opacity="0.28" stroke-linecap="round"/>
      </g>

      <g transform="rotate(136)">
        <path d="M0,-6 C-15,-38 -13,-70 0,-96 C13,-70 15,-38 0,-6 Z"
