<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>
  </defs>
  <!-- Petals -->
  <g transform="translate(32,32)">
    <ellipse rx="8" ry="16" fill="#FBBF24" transform="rotate(0) translate(0,-14)" opacity="0.9"/>
    <ellipse rx="8" ry="16" fill="#F59E0B" transform="rotate(45) translate(0,-14)" opacity="0.85"/>
    <ellipse rx="8" ry="16" fill="#FCD34D" transform="rotate(90) translate(0,-14)" opacity="0.9"/>
    <ellipse rx="8" ry="16" fill="#FBBF24" transform="rotate(135) translate(0,-14)" opacity="0.85"/>
    <ellipse rx="8" ry="16" fill="#F59E0B" transform="rotate(180) translate(0,-14)" opacity="0.9"/>
    <ellipse rx="8" ry="16" fill="#FCD34D" transform="rotate(225) translate(0,-14)" opacity="0.85"/>
    <ellipse rx="8" ry="16" fill="#FBBF24" transform="rotate(270) translate(0,-14)" opacity="0.9"/>
    <ellipse rx="8" ry="16" fill="#F59E0B" transform="rotate(315) translate(0,-14)" opacity="0.85"/>
    <!-- Center -->
    <circle r="8" fill="url(#g)"/>
